<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir & Keranjang Belanja</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Kasir & Keranjang Belanja</h1>

  <div class="container">

    <div class="card">
      <h2>Tambah Barang</h2>

      <form id="formBarang">

        <label for="namaBarang">Nama Barang</label>
        <input type="text" id="namaBarang" placeholder="Masukkan nama barang">
        <p id="errorNama"></p>

        <label for="harga">Harga Satuan</label>
        <input type="number" id="harga" placeholder="Minimal Rp500">
        <p id="errorHarga"></p>

        <label for="qty">Jumlah / Qty</label>
        <input type="number" id="qty" placeholder="Minimal 1">
        <p id="errorQty"></p>

        <button type="submit">Tambah ke Keranjang</button>

      </form>
    </div>

    <div class="card">
      <h2>Keranjang Belanja</h2>

      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Barang</th>
            <th>Harga</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="daftarBarang"></tbody>
      </table>

      <p id="keranjangKosong">Keranjang masih kosong.</p>
    </div>

    <div class="card">
      <h2>Pembayaran</h2>

      <p>Total Belanja: <strong id="totalBelanja">Rp0</strong></p>

      <p>Diskon: <strong id="diskon">Rp0</strong></p>

      <p>Total Akhir: <strong id="totalAkhir">Rp0</strong></p>

      <label for="uangBayar">Uang Bayar</label>
      <input type="number" id="uangBayar" placeholder="Masukkan uang bayar">

      <p id="kembalian">Kembalian: Rp0</p>

      <button id="reset">Transaksi Baru</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
